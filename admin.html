<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samexxa CMS — Super Admin</title><link rel="stylesheet" href="assets/site.css"></head><body><div id="nav"></div><main class="admin"><div class="wrap"><div class="head"><div><div class="eyebrow">Super Admin</div><h1 class="page-title">Dynamic Content CMS</h1><p>Manage website content, homepage banners, social links and enquiry inbox. Changes are saved in this browser and immediately used by the website.</p></div></div><div class="admin-grid"><aside class="side glass"><button class="active" onclick="tab('content',this)">CMS Content</button><button onclick="tab('banners',this)">Homepage Banners</button><button onclick="tab('social',this)">Social & App</button><button onclick="tab('faq',this)">FAQ</button><button onclick="tab('inbox',this)">Enquiry Inbox</button></aside><section class="editor glass" id="editor"></section></div></div></main><div id="footer"></div><script src="assets/site.js"></script><script>
const esc=s=>(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function tab(t,btn){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const e=document.querySelector('#editor');if(t==='content')e.innerHTML=`<h2>CMS Content</h2><p class="muted">These fields are shared by the website pages. Keep the same content in sync with the mobile app CMS.</p><label>About Us title</label><input id="aboutTitle" value="${esc(SITE.about.title)}"><br><br><label>About Us content</label><textarea id="aboutContent">${esc(SITE.about.content)}</textarea><div class="row"><div><label>Terms & Conditions</label><textarea id="terms">${esc(SITE.pages.terms.content)}</textarea></div><div><label>Privacy Policy</label><textarea id="privacy">${esc(SITE.pages.privacy.content)}</textarea></div></div><label>Return & Refund Policy</label><textarea id="refund">${esc(SITE.pages.refund.content)}</textarea><button class="pill orange" onclick="saveContent()">Save CMS Content</button>`;if(t==='banners')renderBanners();if(t==='social')e.innerHTML=`<h2>Social & App Settings</h2><div class="row"><input id="facebook" placeholder="Facebook URL" value="${esc(SITE.social.facebook)}"><input id="instagram" placeholder="Instagram URL" value="${esc(SITE.social.instagram)}"><input id="youtube" placeholder="YouTube URL" value="${esc(SITE.social.youtube)}"><input id="linkedin" placeholder="LinkedIn URL" value="${esc(SITE.social.linkedin)}"><input id="x" placeholder="X URL" value="${esc(SITE.social.x)}"><input id="appStore" placeholder="App Store URL" value="${esc(SITE.stores.appStore)}"><input id="playStore" placeholder="Google Play URL" value="${esc(SITE.stores.playStore)}"></div><button class="pill orange" onclick="saveSocial()">Save Settings</button>`;if(t==='faq')renderFaq();if(t==='inbox')renderInbox()}
function saveContent(){SITE.about.title=document.querySelector('#aboutTitle').value;SITE.about.content=document.querySelector('#aboutContent').value;SITE.pages.terms.content=document.querySelector('#terms').value;SITE.pages.privacy.content=document.querySelector('#privacy').value;SITE.pages.refund.content=document.querySelector('#refund').value;saveSite();alert('CMS content saved.');}
function saveSocial(){['facebook','instagram','youtube','linkedin','x'].forEach(k=>SITE.social[k]=document.querySelector('#'+k).value);SITE.stores.appStore=document.querySelector('#appStore').value;SITE.stores.playStore=document.querySelector('#playStore').value;saveSite();alert('Social and app settings saved.');}
function renderBanners(){const e=document.querySelector('#editor');e.innerHTML='<h2>Homepage Sliders</h2><p class="muted">Each banner supports title, text, CTA and hyperlink.</p>'+SITE.banners.map((b,i)=>`<div class="banner-item"><div class="row"><input id="bt${i}" value="${esc(b.title)}"><input id="bu${i}" value="${esc(b.button)}"></div><textarea id="bx${i}">${esc(b.text)}</textarea><input id="bl${i}" value="${esc(b.link)}"></div>`).join('')+'<button class="pill orange" onclick="saveBanners()">Save Banners</button>'}
function saveBanners(){SITE.banners.forEach((b,i)=>{b.title=document.querySelector('#bt'+i).value;b.button=document.querySelector('#bu'+i).value;b.text=document.querySelector('#bx'+i).value;b.link=document.querySelector('#bl'+i).value});saveSite();alert('Banners saved.');}
function renderFaq(){const e=document.querySelector('#editor');e.innerHTML='<h2>FAQ CMS</h2>'+SITE.faq.map((x,i)=>`<div class="banner-item"><input id="fq${i}" value="${esc(x.q)}"><textarea id="fa${i}">${esc(x.a)}</textarea></div>`).join('')+'<button class="pill orange" onclick="saveFaq()">Save FAQ</button>'}
function saveFaq(){SITE.faq.forEach((x,i)=>{x.q=document.querySelector('#fq'+i).value;x.a=document.querySelector('#fa'+i).value});saveSite();alert('FAQ saved.');}
function renderInbox(){const list=JSON.parse(localStorage.getItem('samexxa_enquiries')||'[]');document.querySelector('#editor').innerHTML='<h2>Enquiry Inbox</h2><p class="muted">'+list.length+' enquiries stored in this browser.</p>'+(list.length?list.map(x=>`<div class="enquiry"><b>${esc(x.subject)}</b><br>${esc(x.name)} · ${esc(x.email)} ${x.phone?'· '+esc(x.phone):''}<br><small>${esc(x.createdAt)}</small><p>${esc(x.message)}</p></div>`).join(''):'<p>No enquiries yet.</p>')}
loadSiteForAdmin();async function loadSiteForAdmin(){await loadSite();tab('content',document.querySelector('.side button'))}
</script></body></html>
